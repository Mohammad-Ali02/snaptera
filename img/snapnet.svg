<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Placeholder: heat exchanger network grid diagram with labeled duties">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="200" fill="#131A31"/>
  <!-- hot streams (left to right) -->
  <g stroke="#FF6B8B" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M30 60h300"/>
    <path d="M30 100h300"/>
  </g>
  <!-- cold stream with a split (right to left) -->
  <g stroke="#4F7CFF" stroke-width="3" stroke-linecap="round" opacity="0.85" fill="none">
    <path d="M330 150H210"/>
    <path d="M210 150c-20 0 -20 -15 -40 -15H110c-20 0 -20 15 -40 15H30"/>
    <path d="M210 150c-20 0 -20 15 -40 15H110c-20 0 -20 -15 -40 -15"/>
  </g>
  <!-- arrowheads -->
  <path d="M330 60l-10 -6v12z" fill="#FF6B8B"/>
  <path d="M330 100l-10 -6v12z" fill="#FF6B8B"/>
  <path d="M30 150l10 -6v12z" fill="#4F7CFF"/>
  <!-- matches -->
  <g stroke="#E6EAF5" stroke-width="2">
    <path d="M120 60v75"/>
    <path d="M250 100v50"/>
  </g>
  <g fill="url(#n)">
    <circle cx="120" cy="60" r="11"/>
    <circle cx="120" cy="135" r="11"/>
    <circle cx="250" cy="100" r="11"/>
    <circle cx="250" cy="150" r="11"/>
  </g>
  <g fill="#0B0F1E" font-family="monospace" font-size="10" text-anchor="middle" dominant-baseline="central">
    <text x="120" y="60">1</text>
    <text x="120" y="135">1</text>
    <text x="250" y="100">2</text>
    <text x="250" y="150">2</text>
  </g>
  <!-- duty labels -->
  <g fill="#9AA3BF" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="120" y="42">4.2 MW</text>
    <text x="250" y="82">7.9 MW</text>
  </g>
  <text x="30" y="32" fill="#9AA3BF" font-family="monospace" font-size="11">network grid diagram</text>
</svg>
