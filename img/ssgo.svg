<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Placeholder: heat exchanger network superstructure diagram">
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="200" fill="#131A31"/>
  <!-- hot streams (left to right) -->
  <g stroke="#FF6B8B" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M30 55h300"/>
    <path d="M30 95h300"/>
  </g>
  <!-- cold streams (right to left) -->
  <g stroke="#4F7CFF" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M330 135H30"/>
    <path d="M330 168H30"/>
  </g>
  <!-- arrowheads -->
  <path d="M330 55l-10 -6v12z" fill="#FF6B8B"/>
  <path d="M330 95l-10 -6v12z" fill="#FF6B8B"/>
  <path d="M30 135l10 -6v12z" fill="#4F7CFF"/>
  <path d="M30 168l10 -6v12z" fill="#4F7CFF"/>
  <!-- exchanger matches -->
  <g stroke="#E6EAF5" stroke-width="2">
    <path d="M110 55v80"/>
    <path d="M200 95v40"/>
    <path d="M265 55v113"/>
  </g>
  <g fill="url(#m)">
    <circle cx="110" cy="55" r="11"/>
    <circle cx="110" cy="135" r="11"/>
    <circle cx="200" cy="95" r="11"/>
    <circle cx="200" cy="135" r="11"/>
    <circle cx="265" cy="55" r="11"/>
    <circle cx="265" cy="168" r="11"/>
  </g>
  <g fill="#0B0F1E" font-family="monospace" font-size="10" text-anchor="middle" dominant-baseline="central">
    <text x="110" y="55">1</text>
    <text x="110" y="135">1</text>
    <text x="200" y="95">2</text>
    <text x="200" y="135">2</text>
    <text x="265" y="55">3</text>
    <text x="265" y="168">3</text>
  </g>
  <text x="30" y="32" fill="#9AA3BF" font-family="monospace" font-size="11">stagewise superstructure</text>
</svg>
