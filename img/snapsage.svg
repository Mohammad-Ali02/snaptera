<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Placeholder: chat with an AI assistant answering a pinch-analysis question">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="360" height="200" fill="#131A31"/>
  <text x="30" y="32" fill="#9AA3BF" font-family="monospace" font-size="11">HEN expert assistant</text>

  <!-- user bubble (right) -->
  <rect x="182" y="46" width="148" height="32" rx="10" fill="url(#sg)" opacity="0.9"/>
  <text x="256" y="62" fill="#0B0F1E" font-family="monospace" font-size="10" text-anchor="middle" dominant-baseline="central">where is my pinch?</text>

  <!-- assistant bubble (left) with mini composite curves -->
  <rect x="30" y="92" width="205" height="80" rx="10" fill="#1B2340" stroke="#2A3558"/>
  <text x="225" y="106" text-anchor="end" fill="#E6EAF5" font-family="monospace" font-size="9">pinch = 149 &#176;C</text>
  <!-- hot composite -->
  <path d="M48 158 L98 128 L158 116" stroke="#FF6B8B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- cold composite -->
  <path d="M66 164 L126 150 L222 120" stroke="#4F7CFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- pinch marker -->
  <path d="M107 112 V166" stroke="#9AA3BF" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="107" cy="136" r="3.5" fill="url(#sg)"/>

  <!-- typing indicator for next answer -->
  <rect x="30" y="180" width="46" height="14" rx="7" fill="#1B2340" stroke="#2A3558"/>
  <g fill="#9AA3BF">
    <circle cx="44" cy="187" r="2"/>
    <circle cx="53" cy="187" r="2"/>
    <circle cx="62" cy="187" r="2"/>
  </g>
</svg>
